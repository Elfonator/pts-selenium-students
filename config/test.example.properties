# Skopírujte ako config/test.properties a doplňte údaje.
# Súbor sa číta ako UTF-8. Heslá neukladajte do Gitu.
# Priorita: -Dparameter > premenná prostredia > tento súbor > predvolené hodnoty.
base.url=http://127.0.0.1:8080/

# Účet izolovaného pracovného priestoru, pripravený vyučujúcim:
# V PHP projekte: php bin/fixtures.php create
# Sem patria hodnoty email a password z výstupu tohto príkazu.
test.email=SEM_EMAIL_Z_FIXTURE
test.password=SEM_HESLO_Z_FIXTURE

browser=chrome
headless=false
timeout.seconds=15

# Po overení zruší iba vlastnú objednávku cez GUI a obnoví zásoby.
# Záznam zostáva v histórii so stavom cancelled; UUID a dôkazy zostávajú uložené.
cleanup.order=true

# Verzia deklarovaná vyučujúcim, nie automaticky zistená cez GUI.
app.version=1.0.0

# Voliteľné pre offline učebňu / neštandardnú inštaláciu prehliadača.
# Použite lomky / aj na Windows. Ovládač musí zodpovedať prehliadaču.
# driver.path=C:/tools/chromedriver.exe
# browser.binary=C:/Program Files/Google/Chrome/Application/chrome.exe